name: Setup check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  local:
    name: ${{ matrix.os }}, ${{ matrix.node }} Node.js
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [current, outdated]
    env:
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node == 'current' && '22' || '18' }}

      - name: Install uv (macOS / Linux, as in the README)
        if: runner.os != 'Windows'
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install uv (Windows, as in the README)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell -ExecutionPolicy ByPass -c "irm https://astral.sh/uv/install.ps1 | iex"
          "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - run: uv run dev.py check

      - name: Angular tests
        run: uv run dev.py npm test

  codespaces:
    name: Codespaces container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/${{ github.repository }}/devcontainer
          push: never
          runCmd: uv run dev.py check
